spring.application.name=helpdesk-api
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

#or put update
#validate tells Hibernate to validate the entity mappings against the schema
#This means Hibernate checks whether the required tables exist; it does not create them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
#secure=false is only for local HTTP testing. In production, use HTTPS and set secure=true.
spring.profiles.active=dev